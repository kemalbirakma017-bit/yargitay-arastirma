name: Python tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile server.py webapp.py mevzuat_kaynak.py test_mock.py test_genel_kurul.py test_birlesik_e2e.py
      - run: python test_mock.py
      - run: python test_genel_kurul.py
      - run: python test_birlesik_e2e.py
