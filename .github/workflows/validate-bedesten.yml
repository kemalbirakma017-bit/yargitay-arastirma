name: Validate Bedesten MCP
on:
  push:
    branches: [main, fastmcp-bedesten]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile bedesten_server.py
      - run: python -m unittest discover -s tests -v
      - run: fastmcp inspect bedesten_server.py:mcp
